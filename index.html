<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="public/assets/css/output.css" />

    <!-- SEO -->
    <meta name="author" content="Mark Lhester Pile" />
    <meta
      name="description"
      content="A personal profile page for Mark Lhester Pile showcasing his personality, values, interests, favorites, and social media used"
    />

    <!-- SEO - Open Graphs -->
    <meta property="og:title" content="Personal Profile Page" />
    <meta
      property="og:description"
      content="A personal profile showcasing my personality, values, interests, and socials."
    />
    <meta
      property="og:image"
      content="/assets/visual_assets/images/photos/profile.jpg"
    />
    <meta
      property="og:image:alt"
      content="A picture of Mark Lhester Pile in black clothes and low angle shot using a digital camera"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:locale" content="fil_PH" />
    <meta property="og:site_name" content="Mark's Profile Page" />
    <meta property="og:url" content="https://marklhesterpile-dev.com/" />
    <meta property="og:type" content="website" />

    <!-- Open Graphs - For Personal Pages -->
    <meta property="profile:first_name" content="Mark Lhester" />
    <meta property="profile:last_name" content="Pile" />
    <meta property="profile:username" content="pilemarklhester028" />
    <meta property="profile:gender" content="male" />

    <!-- Favicon -->
    <link
      rel="icon"
      href="public/assets/visual_assets/images/photos/favicon.png"
      type="image/png"
      sizes="32x32"
    />

    <!-- Scripts -->
    <script src="components/headerNav.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Funnel+Display:wght@300..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Major+Mono+Display&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>Personal Profile Page</title>
  </head>
  <body class="min-h-svh bg-white">
    <header
      class="flex items-center justify-between flex-nowrap gap-12 w-full fixed z-9999"
    >
      <div class="w-full invisible"></div>

      <div
        class="w-full p-4 bg-night-300/20 rounded-b-2xl flex items-center justify-between backdrop-blur-xl border-l-2 border-r-2 border-b-2 border-black/10"
      >
        <ul
          class="grid grid-cols-[repeat(5,minmax(120px,1fr))] items-center justify-center w-full relative"
        >
          <span
            class="pill absolute top-0 left-0 h-full bg-blue-400 rounded-lg z-0 transition-all"
          ></span>

          <li class="list-none flex items-center justify-center">
            <a
              href="#home"
              class="active relative z-1 inline-block no-underline px-7 py-3 cursor-pointer leading-snug font-normal text-black transition-colors duration-150 hover:text-blue-500 [&.active]:text-white [&.active]:font-semibold"
              >Home</a
            >
          </li>
          <li class="list-none flex items-center justify-center">
            <a
              href="#about"
              class="relative z-1 inline-block no-underline px-7 py-3 cursor-pointer leading-snug font-normal text-black transition-colors duration-150 hover:text-blue-500 [&.active]:text-white [&.active]:font-semibold"
              >About</a
            >
          </li>
          <li class="list-none flex items-center justify-center">
            <a
              href="#interests"
              class="relative z-1 inline-block no-underline px-7 py-3 cursor-pointer leading-snug font-normal text-black transition-colors duration-150 hover:text-blue-500 [&.active]:text-white [&.active]:font-semibold"
              >Interests</a
            >
          </li>
          <li class="list-none flex items-center justify-center">
            <a
              href="#favorites"
              class="relative z-1 inline-block no-underline px-7 py-3 cursor-pointer leading-snug font-normal text-black transition-colors duration-150 hover:text-blue-500 [&.active]:text-white [&.active]:font-semibold"
              >Favorites</a
            >
          </li>
          <li class="list-none flex items-center justify-center">
            <a
              href="#socials"
              class="relative z-1 inline-block no-underline px-7 py-3 cursor-pointer leading-snug font-normal text-black transition-colors duration-150 hover:text-blue-500 [&.active]:text-white [&.active]:font-semibold"
              >Socials</a
            >
          </li>
        </ul>
      </div>

      <div class="w-full invisible"></div>
    </header>
  </body>
</html>
